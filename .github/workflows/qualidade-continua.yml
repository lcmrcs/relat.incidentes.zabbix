name: Qualidade contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qualidade:
    name: Qualidade Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            zabbix-report/requirements.txt

      - name: Instalar dependências controladas
        run: python -m pip install -r zabbix-report/requirements.txt -r requirements-dev.txt

      - name: Verificar Ruff
        run: ruff check .

      - name: Verificar Black
        run: git ls-files -z '*.py' | xargs -0 -n 1 black --check

      - name: Compilar fontes Python
        run: python -m compileall -q -x '(^|/)(venv|venv-windows|reports)(/|$)' scripts zabbix-report

      - name: Validar estrutura dos workflows
        run: pytest -q zabbix-report/tests/test_ci_workflows.py

  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            zabbix-report/requirements.txt

      - name: Instalar dependências controladas
        run: python -m pip install -r zabbix-report/requirements.txt -r requirements-dev.txt

      - name: Executar testes sem Zabbix real
        run: pytest

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Procurar credenciais acidentais
        run: python scripts/check_secrets.py

      - name: Validar whitespace do repositório
        run: git diff --check HEAD^ HEAD
