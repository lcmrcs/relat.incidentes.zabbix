name: Validação em navegador

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: navegador-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  alteracoes:
    name: Detectar mudanças visuais
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevante: ${{ steps.filtro.outputs.relevante }}
    steps:
      - name: Baixar histórico necessário
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Identificar caminhos relevantes
        id: filtro
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "relevante=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git show --pretty="" --name-only HEAD > changed-files.txt
          else
            git diff --name-only "$BEFORE_SHA" HEAD > changed-files.txt
          fi

          if grep -Eq '^(zabbix-report/templates/|zabbix-report/zabbix_report\.py$|zabbix-report/summary\.py$|zabbix-report/tests/visual_baselines/|scripts/validate_(html_browser|visual_accessibility)\.py$|requirements(-dev)?\.txt$|zabbix-report/requirements\.txt$|\.github/workflows/)' changed-files.txt; then
            echo "relevante=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevante=false" >> "$GITHUB_OUTPUT"
          fi

  html:
    name: HTML no Navegador
    needs: alteracoes
    if: needs.alteracoes.outputs.relevante == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            zabbix-report/requirements.txt

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r zabbix-report/requirements.txt -r requirements-dev.txt

      - name: Remover evidência anterior
        shell: pwsh
        run: |
          Remove-Item VALIDACAO_NAVEGADOR_SPRINT_6.json -ErrorAction SilentlyContinue
          Remove-Item VALIDACAO_NAVEGADOR_SPRINT_6.md -ErrorAction SilentlyContinue

      - name: Validar HTML fictício no Edge
        run: python scripts/validate_html_browser.py

      - name: Publicar diagnóstico em falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: falha-html-navegador
          path: |
            VALIDACAO_NAVEGADOR_SPRINT_6.json
            VALIDACAO_NAVEGADOR_SPRINT_6.md
            artifacts/html-browser/
          if-no-files-found: warn
          retention-days: 5

      - name: Publicar resumo compacto
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resumo-html-navegador
          path: |
            VALIDACAO_NAVEGADOR_SPRINT_6.json
            VALIDACAO_NAVEGADOR_SPRINT_6.md
          retention-days: 3

  visual:
    name: Regressão Visual
    needs: alteracoes
    if: needs.alteracoes.outputs.relevante == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            zabbix-report/requirements.txt

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r zabbix-report/requirements.txt -r requirements-dev.txt

      - name: Remover evidência anterior
        shell: pwsh
        run: |
          Remove-Item VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.json -ErrorAction SilentlyContinue
          Remove-Item VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.md -ErrorAction SilentlyContinue

      - name: Comparar baselines sem atualizá-las
        run: python scripts/validate_visual_accessibility.py --visual-only

      - name: Publicar evidências da falha visual
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: falha-regressao-visual
          path: |
            VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.json
            VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.md
            artifacts/visual-accessibility/current/
            artifacts/visual-accessibility/diffs/
            zabbix-report/tests/visual_baselines/
          if-no-files-found: warn
          retention-days: 5

      - name: Publicar resumo compacto
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resumo-regressao-visual
          path: |
            VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.json
            VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.md
          retention-days: 3

  acessibilidade:
    name: Acessibilidade
    needs: alteracoes
    if: needs.alteracoes.outputs.relevante == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configurar Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            zabbix-report/requirements.txt

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r zabbix-report/requirements.txt -r requirements-dev.txt

      - name: Remover evidência anterior
        shell: pwsh
        run: |
          Remove-Item VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.json -ErrorAction SilentlyContinue
          Remove-Item VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.md -ErrorAction SilentlyContinue

      - name: Auditar acessibilidade fictícia
        run: python scripts/validate_visual_accessibility.py --accessibility-only

      - name: Publicar violações em falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: falha-acessibilidade
          path: |
            VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.json
            VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.md
          if-no-files-found: warn
          retention-days: 5

      - name: Publicar resumo compacto
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resumo-acessibilidade
          path: |
            VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.json
            VALIDACAO_VISUAL_ACESSIBILIDADE_SPRINT_7.md
          retention-days: 3
