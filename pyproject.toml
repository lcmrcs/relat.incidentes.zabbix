[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
  zabbix-report/venv
  | zabbix-report/venv-windows
  | zabbix-report/reports
  | entrega_supervisor
)
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "zabbix-report/venv",
  "zabbix-report/venv-windows",
  "zabbix-report/reports",
  "entrega_supervisor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"zabbix-report/tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["zabbix-report/tests"]
